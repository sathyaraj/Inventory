<form
  [formGroup]="form"
  (ngSubmit)="save()"
  *ngIf="form"
>

  <div class="min-h-screen overflow-y-auto bg-gray-100 p-2">

    <div
      class="bg-white shadow-lg
             flex flex-col
             overflow-hidden
             p-5"
    >

      <!-- DYNAMIC FORM -->
      <app-dynamic-form
        [form]="form"
        [fields]="fields">
      </app-dynamic-form>

       <!-- VENDORS HEADER -->
  <div class="px-3 py-2 bg-gray-100 mt-8  flex justify-between">
    <div class="font-semibold">Commodity Code</div>
    <button type="button" (click)="addVendor()" class="text-blue-600 hover:underline">New Row</button>
  </div>

  <!-- VENDORS TABLE -->
  <div class="overflow-x-auto">

    <table class="min-w-full text-sm text-left whitespace-nowrap border border-gray-200">

          <!-- HEADER -->
          <thead class="bg-gray-100 text-gray-600 uppercase text-xs sticky top-0 z-10">

            <!-- COLUMN TITLE -->
            <tr>
              <th
                class="px-4 py-3 border border-gray-200 cursor-pointer hover:bg-gray-200"
                (click)="sortTable('code')"
              >

                <div class="flex items-center gap-1">

                  <span>Code</span>

                  <lucide-icon
                    [img]="
                      sortColumn === 'code' &&
                      sortDirection === 'asc'
                        ? moveup
                        : movedown
                    "
                    class="w-3 h-3"
                    [ngClass]="
                      sortColumn === 'code' && sortDirection === 'desc'
                        ? 'text-gray-400'
                        : 'text-blue-600'
                    "
                  >
                  </lucide-icon>
                </div>
              </th>
              <th
                class="px-4 py-3 border border-gray-200 cursor-pointer hover:bg-gray-200"
                (click)="sortTable('description')"
              >
                <div class="flex items-center gap-1">
                  <span>Description</span>
                  <lucide-icon
                    [img]="
                      sortColumn === 'description' &&
                      sortDirection === 'asc'
                        ? moveup
                        : movedown
                    "
                    class="w-3 h-3"
                    [ngClass]="
                      sortColumn === 'description' && sortDirection === 'desc'
                        ? 'text-gray-400'
                        : 'text-blue-600'
                    "
                  >
                  </lucide-icon>

                </div>

              </th>
              
              <th class="border border-gray-200">Action</th>

            </tr>

            <!-- FILTER -->
            <!-- <tr  *ngIf="commoditydetails.length > 0">
              <th class="border border-gray-200 px-2 py-1">

                <input

                />

              </th>

              <th class="border border-gray-200"></th>

          </thead>

                    <!-- BODY -->
         <tbody
  formArrayName="commoditydetails"
  *ngIf="commoditydetails.length > 0">

  <tr
  *ngFor="let row of commoditydetails.controls; let i = index" [formGroupName]="i">

    <td class="border border-gray-200 px-2 py-1">

      <!-- <span *ngIf="expandedIndex !== i">
        {{ row.get('code')?.value }}
      </span> -->

      <input
        formControlName="code"
        class="border border-gray-200 px-2 py-1 w-full">
    </td>

    <td class="border border-gray-200 px-2 py-1">

      <!-- <span *ngIf="expandedIndex !== i">
        {{ row.get('description')?.value }}
      </span> -->

      <input
        formControlName="description"
        class="border border-gray-200 px-2 py-1 w-full">
    </td>

    <td class="border border-gray-200 px-2 py-1">

      <!-- <div *ngIf="expandedIndex !== ((currentPage - 1) * pageSize + i)">

        <button
          type="button"
          class="text-blue-600 mr-2"
          (click)="expandedIndex = (currentPage - 1) * pageSize + i">

          Edit

        </button>

        <button
  type="button"
  class="text-red-600"
   *ngIf="row.get('id')?.value" (click)="deleteVendor(row.get('id')?.value,(currentPage - 1) * pageSize + i)">

          Delete

        </button>

      </div> -->

      <div>

        <button
          type="button"
          class="text-gray-600"
          (click)="cancelVendor(i)">

          Cancel

        </button>

      </div>

    </td>

  </tr>

</tbody>

        </table>

      
  </div>

      <!-- ACTION BUTTONS -->
      <div
        class="flex justify-end gap-4
               border-t mt-10 pt-8"
      >

        <!-- RESET -->
        <button
          type="button"
          (click)="onReset()"
          class="flex items-center gap-3
                 px-3 py-2
                 border border-gray-300
                 text-gray-700 text-[14px]
                 hover:bg-gray-100 transition"
        >

          <lucide-icon
            [img]="RotateCcw"
            class="w-4 h-4">
          </lucide-icon>

          Reset

        </button>

        <!-- SAVE -->
        <button
          type="submit"
          class="flex items-center gap-1
                 px-3 py-2
                 bg-gradient-to-r
                 from-blue-600 to-indigo-600
                 text-white text-[14px]
                 font-medium
                 shadow-lg hover:shadow-xl
                 transition-all"
        >

          <lucide-icon
            [img]="Save"
            class="w-4 h-4">
          </lucide-icon>

          {{ editId > 0 ? 'Update' : 'Save' }}

        </button>

      </div>

    </div>

  </div>

</form>

<!-- MESSAGE BOX -->
<app-message-box
  [title]="messageTitle"
  [message]="messageText"
  [visible]="showMessageBox"
  (onConfirm)="confirmadd()"
  (onCancel)="showMessageBox = false">
</app-message-box>
