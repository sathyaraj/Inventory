<!-- HEADER -->
<div class="bg-gray-100 px-3 border-b border-gray-300 py-2 flex items-center gap-3">

  <div
    class="w-8 h-8
           bg-gradient-to-br from-blue-500 to-indigo-600
           flex items-center justify-center shadow-lg">

    <lucide-icon
      [img]="warehouse"
      class="w-5 h-5 text-white">
    </lucide-icon>

  </div>

  <div>

    <h1 class="text-[20px] font-bold text-gray-800">
      Storeroom Management
    </h1>

    <p class="text-gray-500 mt-1">
      Create and manage storerooms and inventory locations
    </p>

  </div>

</div>

<div class="p-6 bg-white min-h-screen">

  <!-- PAGE HEADER -->
  <div class="flex justify-between items-center mb-6">

    <div>

      <h1 class="text-[18px] font-semibold text-gray-800">
        Storeroom List
      </h1>

      <p class="text-sm text-gray-500">
        Manage Storerooms
      </p>

    </div>

    <button
      (click)="addStoreroom()"
      class="border border-indigo-700
             text-indigo-700
             hover:bg-indigo-700
             hover:text-white
             px-4 py-2 rounded shadow">

      + Create Storeroom

    </button>

  </div>

  <!-- SEARCH + COLUMN SELECT -->
  <div class="bg-white p-4 rounded shadow mb-6">

    <div class="flex flex-wrap items-center gap-3">

      <div class="flex gap-2 ml-auto">

        <div class="relative inline-block">

          <button
            (click)="showColumnDropdown = !showColumnDropdown"
            class="border border-gray-200 px-4 py-2 rounded bg-white shadow">

            Select Columns

          </button>

          <div
            *ngIf="showColumnDropdown"
            class="absolute mt-2 bg-white border border-gray-200 shadow rounded
                   p-3 w-64 z-50 max-h-80 overflow-y-auto">

            <label
              *ngFor="let col of columns"
              class="flex items-center gap-2 py-1">

              <input
                type="checkbox"
                [(ngModel)]="col.visible" />

              {{ col.title }}

            </label>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- TABLE -->
  <div class="bg-white rounded shadow overflow-x-auto max-h-[700px] relative">

    <table class="min-w-full text-sm text-left whitespace-nowrap">

      <!-- TABLE HEADER -->
      <thead class="bg-gray-100 text-gray-600 uppercase text-xs sticky top-0 z-10">

        <tr>

          <th
            *ngFor="let col of columns"
            [hidden]="!col.visible"
            class="px-4 py-3 border border-gray-200 cursor-pointer hover:bg-gray-200"
            (click)="sortTable(col.field)">

            <div class="flex items-center gap-1">

              <span>{{ col.title }}</span>

              <lucide-icon
                [img]="
                  sortColumn === col.field &&
                  sortDirection === 'asc'
                    ? moveup
                    : movedown
                "
                class="w-3 h-3"
                [ngClass]="
                  sortColumn === col.field &&
                  sortDirection === 'desc'
                    ? 'text-gray-400'
                    : 'text-blue-600'
                ">
              </lucide-icon>

            </div>

          </th>

        </tr>

      </thead>

      <!-- FILTER -->
      <thead class="bg-gray-100 sticky top-0 z-10">

        <tr>

          <th
            *ngFor="let col of columns"
            [hidden]="!col.visible"
            class="border border-gray-200">

            <input
              type="text"
              placeholder="{{ col.title }}"
              class="border px-2 py-1 text-xs rounded m-1 h-8 w-[90%]" />

          </th>

        </tr>

      </thead>

      <!-- BODY -->
      <tbody class="divide-y relative">

        <tr
          *ngFor="let item of paginatedItems; let i = index"
          class="group relative border border-gray-200 hover:bg-blue-50 transition"
          [class.bg-gray-50]="i % 2 === 0"
          (click)="openItem(item.id)">

          <td
            *ngFor="let col of columns"
            [hidden]="!col.visible"
            class="px-4 py-2 border border-gray-200">

            {{ item[col.field] }}

          </td>

          <td
            class="sticky right-0 bg-white border border-gray-200
                   w-[80px] z-20 opacity-0 opacity-100
                   transition-all duration-200">

            <div
              class="flex items-center justify-center gap-2 px-2">

              <button
                type="button"
                class="p-1 rounded hover:bg-green-100">

                <lucide-icon
                  [img]="pencil"
                  class="w-4 h-4 text-green-600">
                </lucide-icon>

              </button>

              <button
                type="button"
                class="p-1 rounded hover:bg-red-100"
                (click)="deleteItem(item.id); $event.stopPropagation()">

                <lucide-icon
                  [img]="trash"
                  class="w-4 h-4 text-red-600">
                </lucide-icon>

              </button>

            </div>

          </td>

        </tr>

        <!-- EMPTY -->
        <tr *ngIf="!paginatedItems || paginatedItems.length === 0">

          <td
            [attr.colspan]="columns.length + 1"
            class="text-center py-16">

            <div class="flex flex-col items-center justify-center">

              <lucide-icon
                [img]="warehouse"
                class="w-10 h-10 text-gray-300 mb-3">
              </lucide-icon>

              <h2 class="text-lg font-semibold text-gray-600">
                No Storerooms Found
              </h2>

              <p class="text-sm text-gray-400 mt-1">
                No storeroom records available right now.
              </p>

              <button
                (click)="addStoreroom()"
                class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">

                + Create Storeroom

              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

<app-message-box
  [title]="messageTitle"
  [message]="messageText"
  [visible]="showMessageBox"
  (onConfirm)="confirmDelete()"
  (onCancel)="showMessageBox = false">
</app-message-box>
